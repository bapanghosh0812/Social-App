apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: college-campus-ingress
  namespace: campus-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: college-campus-service
spec:
  tls:
  - hosts:
    - api.collegecampus.in
    - app.collegecampus.in
    secretName: college-campus-tls
  rules:
  - host: api.collegecampus.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: college-campus-service
            port:
              number: 80
